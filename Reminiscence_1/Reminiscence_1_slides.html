<script>
const scenes = Array.from(document.querySelectorAll(".comic-scene"));
const fullTexts = scenes.map(scene => scene.dataset.text.trim());
const textElements = scenes.map(scene => scene.querySelector(".comic-text"));
const pictures = scenes.map(scene => scene.querySelector(".comic-picture"));

const audioFile = document.getElementById("audioFile");
const volumeSlider = document.getElementById("myRange");

let currentScene = 0;
let textIndex = 0;
let typingInterval = null;
let typing = false;
let animationFinished = false;
let transitioning = false;
let hasStarted = false;

const typingSpeed = 10;
const transitionDuration = 800;
const pictureAnimations = ["nothing","nothing","nothing","nothing","nothing","nothing","nothing", 
                          "slide-down", "slide-right", 
                          "nothing_slide_right", "slideUp", "nothing_slide_Up", 
                          "slide-right2", "nothing_slide_right2","nothing_slide_right2",
                          "Hierophant","Hierophant","slideLeft","slide-down2","slideLeft","slideLeftNothing",
                          "nothing","nothing","slide-down3","nothing_slide_down3","nothing_slide_down3","slide-down4","nothing_slide_down4","nothing","nothing"];

    
audioFile.volume = 0.2;
volumeSlider.value = 20;
volumeSlider.addEventListener("input", () => {
  audioFile.volume = volumeSlider.value / 100;
});
    
audioFile.addEventListener("ended", () => {
  audioFile.currentTime = 0;
  audioFile.play();
});
    
function startTyping() {
  const textBox = textElements[currentScene];
  textBox.style.display = "block";
  textBox.textContent = "";
  clearInterval(typingInterval);
  textIndex = 0;
  typing = true;

  typingInterval = setInterval(() => {
    const fullText = fullTexts[currentScene];

    if (textIndex < fullText.length) {
      textBox.textContent += fullText.charAt(textIndex);
      textIndex++;
    } else {
      clearInterval(typingInterval);
      typingInterval = null;
      typing = false;
      showEKeyPrompt(); // Show E prompt when text finishes typing
    }
  }, typingSpeed);
}
    
    
function showEKeyPrompt() {
  const prompt = document.getElementById("eKeyPrompt");
  if (prompt) {
    prompt.style.display = "block"; // Add this line
    prompt.classList.add("show");
    prompt.classList.remove("hidden", "pressed");
  }
}

function hideEKeyPrompt() {
  const prompt = document.getElementById("eKeyPrompt");

  if (!prompt) return;

  setTimeout(() => {
    prompt.classList.remove("show", "pressed");
    prompt.style.display = "none";
  }, 100); //Wait
}

function pressEKeyPrompt() {
  const prompt = document.getElementById("eKeyPrompt");
  if (prompt) {
    prompt.classList.add("pressed");
    setTimeout(() => {
      prompt.classList.remove("pressed");
    }, 150);
  }
}

    
function restartPictureAnimation(index) {
  const picture = pictures[index];
  const animationClass = pictureAnimations[index] || "slide-right";

  picture.classList.remove(...pictureAnimations);
  void picture.offsetWidth; // force restart
  picture.classList.add(animationClass);
  picture.style.animation = "";
  picture.style.transform = "";
}

function setFinalPicturePosition(picture) {
  picture.classList.remove(...pictureAnimations);
  picture.style.animation = "none";
  
  // Set the final transform based on which scene we're on
  const finalPositions = [
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(-150px, -550px)",  //(slide-down) - top position
    "translate(-470px, -300px)", // (slide-right) - right postioon
    "translate(-470px, -300px)", // (slide-right) - right postioon
    "translate(-30px, -80px)",  // (slide-up) - down postion 
    "translate(-30px, -80px)",  // (slide-up) - down postion 
    "translate(-450px, -400px)", // (slide-right) - right position 
    "translate(-450px, -400px)", // (slide-right) - right position
    "translate(-450px, -400px)", // (slide-right) - right position
    "translate(-2300px, -1850px)", // Hierophant
    "translate(-2300px, -1850px)", // Hierophant
    "translate(0, -300px)",   // (slide-left) - left position
    "translate(0, -150px)",  //(slide-down2) - top position
    "translate(0, -300px)",   // (slide-left) - left position
    "translate(0, -300px)",   // (slide-left) - left position
    "translate(0, 0)",
    "translate(0, 0)",
    "translate(-5px, -385px)",//(slide-down3) - top position
    "translate(-5px, -385px)",//(slide-down3) - top position
    "translate(-5px, -385px)",//(slide-down3) - top position
    "translate(100px, -575px)", //(slide-down4) - top position
    "translate(100px, -575px)", //(slide-down4) - top position
    "translate(0, 0)",
    "translate(0, 0)"
  ];
  
  picture.style.transform = finalPositions[currentScene];
}

function showScene(index) {
  const scene = scenes[index];
  const picture = pictures[index];

  scene.classList.add("active");
  restartPictureAnimation(index);

  animationFinished = false;

  picture.onanimationend = function () {
    if (currentScene === index) {
      animationFinished = true;

      if (!transitioning) {
        startTyping();
      }
    }
  };
}

function nextScene() {
  if (transitioning || currentScene >= scenes.length - 1) return;

  transitioning = true;
  clearInterval(typingInterval);
  typingInterval = null;
  typing = false;

  const oldScene = scenes[currentScene];
  const oldIndex = currentScene;
  const nextIndex = currentScene + 1;
  const newScene = scenes[nextIndex];

  currentScene = nextIndex;

  const oldPicture = pictures[oldIndex];
  const newPicture = pictures[nextIndex];
  
  // Check if the pictures are the same
  const isSamePicture = oldPicture.src === newPicture.src;

  newScene.classList.add("active");
  oldScene.classList.remove("active");

  if (!isSamePicture) {
    // Only fade if pictures are different
    const isNextNothing = pictures[nextIndex].classList.contains("nothing", "nothing2");
    
    if (!isNextNothing) {
      newScene.classList.add("scene-fade-in");
      oldScene.classList.add("scene-fade-out");
    }
  }

  showScene(currentScene);

  setTimeout(() => {
    oldScene.classList.remove("active", "scene-fade-out");
    newScene.classList.remove("scene-fade-in");

    textElements[oldIndex].style.display = "none";
    textElements[oldIndex].textContent = "";

    transitioning = false;
    hideEKeyPrompt();
    if (animationFinished) {
      startTyping();
    }
  }, isSamePicture ? 0 : (pictures[nextIndex].classList.contains("nothing") ? 0 : transitionDuration));
}

document.addEventListener("keydown", event => {
  if (event.key.toLowerCase() !== "e" || event.repeat) return;

  if (!hasStarted) {
    hasStarted = true;
    const instructions = document.getElementById("startInstructions");
    if (instructions) {
      instructions.remove();
    }
    audioFile.currentTime = 0;
    audioFile.play().catch(error => {
      console.error("The audio could not start:", error);
    });
    showScene(0);
    return;
  }

  pressEKeyPrompt();

  if (transitioning) return;

  if (!animationFinished) {
    setFinalPicturePosition(pictures[currentScene]);
    animationFinished = true;
    startTyping();
    return;
  }

  if (typing) {
    clearInterval(typingInterval);
    typingInterval = null;
    textElements[currentScene].textContent = fullTexts[currentScene];
    typing = false;
    showEKeyPrompt();
    return;
  }

  // Check if this is the final scene and user pressed E after text finished
  if (currentScene === scenes.length - 1) {
    setTimeout(() => {
      history.back();
    }, 500);
    return;
  }

  hideEKeyPrompt();
  nextScene();
});
    
// Check if we've reached the final scene and trigger navigation
function checkIfFinalScene() {
  if (currentScene === scenes.length - 1 && typing === false && animationFinished === true) {
    setTimeout(() => {
      history.back();
    }, 7000); // Small delay to let the user see the final text
  }
}
</script>
